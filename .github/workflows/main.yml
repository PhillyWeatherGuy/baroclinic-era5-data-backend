name: Generate ERA5 Storm Data

run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.parameters && format('ERA5 Custom: {0}', inputs.parameters) || 'ERA5 All Parameters') || 'ERA5 Storm Build' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      parameters:
        description: 'Parameters to run (e.g. 2t prate pva). Leave blank to run all.'
        required: false
        type: string

# One job per branch so runs do not conflict
concurrency:
  group: era5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-plot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy xarray zarr gcsfs fsspec opencv-python-headless contourpy netCDF4 boto3 huggingface_hub

    - name: Run ERA5 Data Texture Pipeline & Upload
      env:
        B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
        B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        TARGET_PARAMS: ${{ inputs.parameters }}
      run: |
        if [ -n "$TARGET_PARAMS" ]; then
          python processERA5.py $TARGET_PARAMS
        else
          python processERA5.py
        fi
